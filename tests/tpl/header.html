<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="stylesheet" href="tpl/styles.css">
  <link rel="stylesheet" href="tpl/main.3.css">
  <link rel="stylesheet" href="tpl/desert.css">
  <script defer src="tpl/lang-rye.js"></script>
  <script defer src="tpl/run_prettify.js"></script>
  <script defer src="tpl/menu.js"></script>
</head>
<body>
  <div class="container">
    <aside class="sidebar" id="menu-holder" aria-label="Reference navigation">
      <a class="home-link" href="https://ryelang.org">← Rye home</a>
      <h2>Function reference</h2>
      <nav aria-label="Source directories">
        <ul class="page-links">{{menu}}</ul>
      </nav>
      <label for="menu-search">Find a builtin</label>
      <input id="menu-search" type="search" placeholder="Filter names and files…" autocomplete="off">
      <nav id="outline" aria-label="Files and builtins"></nav>
    </aside>
    <main class="content" id="content">
      <h1>{{title}}</h1>
      <p>Browse by source file and section. Examples are generated from builtin tests.</p>
